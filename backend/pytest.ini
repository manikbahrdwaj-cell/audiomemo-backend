[pytest]
# PyTest Configuration

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Coverage options (when using pytest-cov)
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests combining multiple modules
    performance: Performance and benchmark tests
    edge_cases: Edge case and error handling tests
    slow: Tests that take significant time
    database: Tests involving database operations
    websocket: Tests for WebSocket functionality
    embedding: Tests for embedding operations
    enrollment: Tests for enrollment service
    matching: Tests for matching logic
    smoke: Quick smoke tests
    skip_on_windows: Tests to skip on Windows
    requires_model: Tests requiring pre-trained models

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Test paths
testpaths = tests

# Ignore certain directories
norecursedirs = .git .venv venv node_modules __pycache__ *.egg-info .pytest_cache pretrained_models

# Console output
console_output_style = progress
