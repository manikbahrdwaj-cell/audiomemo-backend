[pytest]
# pytest configuration for Phase 4 unit testing (Phase 4, Step 4.1)

# Test discovery
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Coverage options
# Run pytest with: pytest --cov=. --cov-report=html
# This will generate coverage report in htmlcov/index.html

# Markers for test categorization
markers =
    unit: unit tests for utility functions
    integration: integration tests
    slow: slow running tests
    database: tests requiring MongoDB connection
    embedding: tests for embedding generation
    similarity: tests for similarity calculations

# Test timeout (seconds)
timeout = 300

# Minimum Python version
minversion = 7.0

# Ignore certain patterns
testpaths = 
    .

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
