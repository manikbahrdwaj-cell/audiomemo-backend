              node = f"{case.get('classname', '')}.{case.get('name', '')}"
              failed.extend(tc for tc in critical if tc and tc in node)

          if failed:
              print(f"::error::{stage} gate failed. Critical: {sorted(set(failed))}")
              sys.exit(1)
          print(f"{stage} gate passed")
          PY

      - name: Upload functional results
        if: always()
