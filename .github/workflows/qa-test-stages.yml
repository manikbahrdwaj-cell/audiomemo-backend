  regression:
    name: Regression
    needs: [smoke, functional]
    if: >-
      ${{ !cancelled()
      && needs.smoke.result != 'failure'
      && needs.functional.result != 'failure'
      && contains(inputs.stages, 'REGRESSION') }}
