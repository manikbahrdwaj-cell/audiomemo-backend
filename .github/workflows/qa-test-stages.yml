# Generated by the QA Intelligence Platform. Manual edits are overwritten on the
# next sync. Job names map onto test stages and must not be renamed.
name: QA Test Stages
run-name: QA Test Stages · ${{ inputs.stages }} · ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Correlation id issued by the QA platform
        required: true
      project_key:
        description: QA project key these tests belong to
        required: true
      stages:
        description: Comma-separated stages to run, in pipeline order
        required: true

permissions:
  contents: read

env:
  QA_SCRIPT_DIR: qa-automation

jobs:
  smoke:
    name: Smoke
    if: contains(inputs.stages, 'SMOKE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qa-automation/requirements.txt
          if python -c "import playwright" 2>/dev/null; then
            python -m playwright install --with-deps chromium
          fi

      - name: Run smoke tests
        continue-on-error: true
        run: |
          pytest qa-automation/smoke \
            --junitxml=junit-smoke.xml \
            -o junit_family=xunit2 -v

      - name: Evaluate smoke quality gate
        env:
          QA_STAGE: SMOKE
        run: |
          python - <<'PY'
          import json, os, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          stage = os.environ["QA_STAGE"]
          report = Path(f"junit-{stage.lower()}.xml")
          if not report.exists():
              print(f"::error::{stage}: no JUnit report was produced")
              sys.exit(1)

          manifest = json.loads(
              Path(os.environ["QA_SCRIPT_DIR"], "manifest.json").read_text(encoding="utf-8")
          )
          critical = {
              case["test_case_id"]
              for entry in manifest["stages"] if entry["stage"] == stage
              for case in entry["test_cases"] if case.get("is_critical")
          }

          failed = []
          for case in ET.parse(report).getroot().iter("testcase"):
              if case.find("failure") is None and case.find("error") is None:
                  continue
              node = f"{case.get('classname', '')}.{case.get('name', '')}"
              failed.extend(tc for tc in critical if tc and tc in node)

          if failed:
              print(f"::error::{stage} gate failed. Critical: {sorted(set(failed))}")
              sys.exit(1)
          print(f"{stage} gate passed")
          PY

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-smoke
          path: junit-smoke.xml
          if-no-files-found: warn


  functional:
    name: Functional
    needs: [smoke]
    if: >-
      ${{ !cancelled()
      && needs.smoke.result != 'failure'
      && contains(inputs.stages, 'FUNCTIONAL') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
